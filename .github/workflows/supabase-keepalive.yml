name: Supabase Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 */3 * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://vhidpztcaolmsgijhvtc.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZoaWRwenRjYW9sbXNnaWpodnRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MTk0NDIsImV4cCI6MjA5MDA5NTQ0Mn0.okrkgbIPBfRvxxyf097p9DY-ACzpxrcBioycR_eEwrQ'
          fi

          curl --fail --show-error --silent \
            "$SUPABASE_URL/rest/v1/clients?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            >/dev/null
